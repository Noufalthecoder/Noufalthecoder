<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="55%" stop-color="#1a0638"/>
      <stop offset="100%" stop-color="#2b0a4f"/>
    </linearGradient>

    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#9b5de5;#f15bb5;#fee440;#00f5d4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#9b5de5">
        <animate attributeName="stop-color" values="#9b5de5;#f15bb5;#fee440;#00f5d4;#9b5de5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f15bb5">
        <animate attributeName="stop-color" values="#f15bb5;#fee440;#00f5d4;#9b5de5;#f15bb5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee440"/>
      <stop offset="45%" stop-color="#f15bb5"/>
      <stop offset="100%" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbA"><stop offset="0%" stop-color="#00f5d4" stop-opacity=".55"/><stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0%" stop-color="#f15bb5" stop-opacity=".5"/><stop offset="100%" stop-color="#f15bb5" stop-opacity="0"/></radialGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>

    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="floor"><rect x="0" y="240" width="1200" height="100"/></clipPath>
    <clipPath id="reveal">
      <rect x="600" y="180" width="0" height="50">
        <animate attributeName="x" values="600;150;150;600" keyTimes="0;.35;.85;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="width" values="0;900;900;0" keyTimes="0;.35;.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <mask id="sunStripes">
      <rect x="0" y="0" width="1200" height="340" fill="#fff"/>
      <g fill="#000">
        <rect x="0" y="212" width="1200" height="3"/>
        <rect x="0" y="222" width="1200" height="5"/>
        <rect x="0" y="232" width="1200" height="7"/>
      </g>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- drifting nebula orbs -->
    <circle cx="200" cy="90" r="220" fill="url(#orbA)">
      <animate attributeName="cx" values="200;320;200" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;140;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="120" r="240" fill="url(#orbB)">
      <animate attributeName="cx" values="1000;880;1000" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;70;120" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="120" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="30" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="170" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="60" r="1.4"><animate attributeName="opacity" values="1;.1;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="20" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="140" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="35" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="160" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="50" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="25" r="1.8"><animate attributeName="opacity" values="1;.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="150" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="70" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="30" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="180" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shooting star -->
    <line x1="0" y1="0" x2="-90" y2="-30" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="1250,20;650,220" dur="6s" keyTimes="0;1" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.05;.15;1" dur="6s" repeatCount="indefinite" begin="1s"/>
    </line>

    <!-- retro sun -->
    <circle cx="600" cy="230" r="120" fill="url(#sun)" mask="url(#sunStripes)" opacity=".85">
      <animate attributeName="r" values="115;125;115" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- synthwave floor -->
    <rect x="0" y="240" width="1200" height="100" fill="#0a0118"/>
    <g clip-path="url(#floor)" stroke="#f15bb5" stroke-width="1.5" opacity=".75">
      <g>
        <line x1="0" y1="245" x2="1200" y2="245"/>
        <line x1="0" y1="256" x2="1200" y2="256"/>
        <line x1="0" y1="270" x2="1200" y2="270"/>
        <line x1="0" y1="288" x2="1200" y2="288"/>
        <line x1="0" y1="310" x2="1200" y2="310"/>
        <line x1="0" y1="336" x2="1200" y2="336"/>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,14" dur="1s" repeatCount="indefinite"/>
      </g>
      <line x1="600" y1="240" x2="600" y2="340"/>
      <line x1="600" y1="240" x2="450" y2="340"/><line x1="600" y1="240" x2="750" y2="340"/>
      <line x1="600" y1="240" x2="290" y2="340"/><line x1="600" y1="240" x2="910" y2="340"/>
      <line x1="600" y1="240" x2="120" y2="340"/><line x1="600" y1="240" x2="1080" y2="340"/>
      <line x1="600" y1="240" x2="-80" y2="340"/><line x1="600" y1="240" x2="1280" y2="340"/>
      <line x1="600" y1="240" x2="-300" y2="340"/><line x1="600" y1="240" x2="1500" y2="340"/>
    </g>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00f5d4" stroke-width="2" filter="url(#glow)">
      <animate attributeName="opacity" values=".6;1;.6" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- name -->
    <g filter="url(#glow)">
      <text x="600" y="130" text-anchor="middle"
            font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            font-size="78" font-weight="900" letter-spacing="6" fill="url(#txt)">
        MOHAMMED NOUFAL
        <animate attributeName="letter-spacing" values="6;10;6" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- tagline reveal -->
    <text x="600" y="212" text-anchor="middle" clip-path="url(#reveal)"
          font-family="'Consolas', 'Courier New', monospace"
          font-size="26" fill="#e0d7ff" letter-spacing="3">
      &lt;/&gt; Full-Stack Developer · Builder · Dreamer
    </text>
  </g>

  <!-- neon border -->
  <rect x="2" y="2" width="1196" height="336" rx="21" fill="none" stroke="url(#txt)" stroke-width="3" opacity=".9"/>
</svg>
