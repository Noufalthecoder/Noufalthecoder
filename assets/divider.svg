<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="25%" stop-color="#9b5de5"/>
      <stop offset="50%" stop-color="#f15bb5"/>
      <stop offset="75%" stop-color="#fee440"/>
      <stop offset="100%" stop-color="#00f5d4"/>
      <animate attributeName="x1" values="0;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="10" y="4" width="1180" height="4" rx="2" fill="url(#g)" filter="url(#glow)"/>
</svg>
