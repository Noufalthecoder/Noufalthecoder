<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 56" width="164" height="56" role="img" aria-label="LINKEDIN">
<title>LINKEDIN</title>
<style>@font-face{font-family:'Nmono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:'Ndisplay','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:800}
.t{font-family:'Ntext','Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:'Nmono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
