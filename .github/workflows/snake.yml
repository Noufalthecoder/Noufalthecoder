name: Profile Magic ✨

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:         # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-magic
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build animated stats + language cards
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist

      - name: Build 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D output
        run: if [ -d profile-3d-contrib ]; then cp -r profile-3d-contrib dist/; fi

      - name: Generate snakes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f15bb5
            dist/github-snake-neon.svg?palette=github-dark&color_snake=#00f5d4&color_dots=#1a0638,#3c1a78,#6a2fbf,#9b5de5,#f15bb5
            dist/github-snake-fire.svg?palette=github-dark&color_snake=#fee440&color_dots=#160a24,#5a1a3a,#a8325e,#f15bb5,#fee440

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
